@keyframes fadeIn    { from{opacity:0}to{opacity:1} }

  { id:9,  cat:'sortie', name:'Parc Letná au coucher',  sub:'Letenské sady · 2 km',  price:'Gratuit','duration':'2h',rating:4.7, votes:{}, color:'#3baa7a',
    tags:['Vue','Pique-nique'], desc:'Point de vue ultime sur les toits de Prague avec la grande buvette en plein air.' },
  { id:10, cat:'restau', name:'Café Savoy',             sub:'Vítězná 5 · 1.1 km',    price:'€€',  duration:'1h',  rating:4.5, votes:{}, color:'#e05a5a',
    tags:['Brunch','Viennoiseries'], desc:'Grand café fin-de-siècle avec plafond néo-gothique. Les meilleurs croissants de Prague.' },

// ── Helpers ────────────────────────────────────────────────────────────────────
const countVotes = (votes) => {
  let yes=0, no=0;
  Object.values(votes).forEach(v=>{ if(v===1) yes++; else if(v===-1) no++; });
  return { yes, no, total: Object.keys(votes).length };
};

const AvatarRow = ({ votes, size=22 }) => (
  <div className="flex gap-1">
    {MEMBERS.map(m => {
      const v = votes[m.id];
      return (
        <div key={m.id} className="flex flex-col items-center gap-0.5">
          <div className="rounded-full flex items-center justify-center font-700 text-white relative"
            style={{width:size,height:size,background:v===1?m.color:v===-1?'rgba(26,23,20,0.12)':'rgba(26,23,20,0.08)',fontSize:size*0.38,opacity:v===undefined?0.3:1}}>
            {m.id}
            {v===1  && <div className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-mint-DEFAULT border border-white flex items-center justify-center" style={{fontSize:7}}>✓</div>}
            {v===-1 && <div className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-rose-DEFAULT border border-white flex items-center justify-center" style={{fontSize:7}}>✕</div>}

);

// ── Results sheet ──────────────────────────────────────────────────────────────

        <div>

        <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center"
          style={{background:'rgba(26,23,20,0.08)'}}>

      <div className="flex-1 overflow-y-auto px-4 pb-24 space-y-2.5">
        {sorted.map((card, i) => {

          const cat = CAT_META[card.cat];
          const isConsensus = yes >= 4;
          return (
            <div key={card.id} className="rounded-3xl p-4" style={{
              ...glass,
              border: isConsensus ? '1.5px solid rgba(59,170,122,0.35)' : undefined,
            }}>

                <div className="w-8 h-8 rounded-xl flex items-center justify-center font-800 text-sm shrink-0"
                  style={{background:'rgba(26,23,20,0.07)', color:'#6b6560'}}>
                  {i+1}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <p className="text-ink font-700 text-sm">{card.name}</p>
                    {isConsensus && <span className="text-[10px] font-700 px-2 py-0.5 rounded-full" style={{background:'rgba(59,170,122,0.12)',color:'#3baa7a'}}>Consensus ✓</span>}

                    <div className="ml-auto">

                </div>

};

// ── Swipe card ─────────────────────────────────────────────────────────────────
const SwipeCard = ({ card, onVote, myVote, animDir }) => {
  const cat = CAT_META[card.cat];
  const { yes, no } = countVotes(card.votes);
  const [drag, setDrag]   = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const startX = React.useRef(null);

  const onTouchStart = e => { startX.current = e.touches[0].clientX; setDragging(true); };
  const onTouchMove  = e => { if(startX.current!==null) setDrag(e.touches[0].clientX - startX.current); };
  const onTouchEnd   = () => {
    setDragging(false);
    if(drag > 60)       { onVote(1);  }
    else if(drag < -60) { onVote(-1); }
    setDrag(0); startX.current = null;
  };

  const rotation  = Math.min(12, Math.max(-12, drag * 0.06));
  const opacity   = Math.max(0.7, 1 - Math.abs(drag) / 300);
  const animClass = animDir === 1 ? 'swipe-right' : animDir === -1 ? 'swipe-left' : '';

  const showYes = drag > 30;
  const showNo  = drag < -30;

  return (
    <div
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      className={`absolute inset-0 select-none ${animClass}`}
      style={{
        transform: dragging ? `translateX(${drag}px) rotate(${rotation}deg)` : 'none',
        transition: dragging ? 'none' : 'transform 0.2s ease',
        opacity,
        cursor: 'grab',
        zIndex: 10,
      }}>

      {/* Card */}
      <div className="w-full h-full rounded-3xl overflow-hidden flex flex-col" style={{
        background:'rgba(255,255,255,0.78)',
        backdropFilter:'blur(24px) saturate(1.8)',
        WebkitBackdropFilter:'blur(24px) saturate(1.8)',
        border:'1px solid rgba(255,255,255,0.85)',
        boxShadow:'0 8px 40px rgba(26,23,20,0.12), inset 0 1px 0 rgba(255,255,255,0.9)',
      }}>
        {/* Illustration area */}
        <div className="relative flex-none h-52 flex items-center justify-center overflow-hidden"
          style={{background:`linear-gradient(135deg,${card.color}22 0%,${card.color}08 100%)`}}>
          {/* Decorative blobs */}
          <div className="absolute w-40 h-40 rounded-full opacity-30" style={{background:card.color,filter:'blur(40px)',top:'-20px',right:'-20px'}}/>
          <div className="absolute w-32 h-32 rounded-full opacity-15" style={{background:card.color,filter:'blur(30px)',bottom:'-10px',left:'-10px'}}/>
          {/* Big initial placeholder */}
          <div className="relative z-10 flex flex-col items-center gap-3">
            <div className="w-20 h-20 rounded-3xl flex items-center justify-center font-800 text-4xl"
              style={{background:`${card.color}20`,backdropFilter:'blur(8px)'}}>
              {card.cat==='restau'?'🍽️':card.cat==='visite'?'🏛️':card.cat==='bar'?'🍸':'🌿'}
            </div>
          </div>
          {/* Category badge */}
          <div className="absolute top-3 left-3 px-3 py-1.5 rounded-full text-xs font-700"
            style={{background:cat.bg,color:cat.color,backdropFilter:'blur(8px)'}}>
            {card.cat}
          </div>
          {/* Price + duration */}
          <div className="absolute top-3 right-3 flex gap-1.5">
            <span className="px-2.5 py-1 rounded-full text-xs font-600" style={{background:'rgba(255,255,255,0.7)',color:'#1a1714'}}>{card.price}</span>
            <span className="px-2.5 py-1 rounded-full text-xs font-600" style={{background:'rgba(255,255,255,0.7)',color:'#1a1714'}}>{card.duration}</span>
          </div>
          {/* Rating */}
          <div className="absolute bottom-3 right-3 flex items-center gap-1 px-2.5 py-1 rounded-full"
            style={{background:'rgba(255,255,255,0.75)'}}>
            <span style={{color:'#e8a030',fontSize:11}}>★</span>
            <span className="text-ink font-700 text-xs">{card.rating}</span>
          </div>

          {/* Swipe overlay hints */}
          {showYes && (
            <div className="absolute inset-0 flex items-center justify-center rounded-3xl fade-in"
              style={{background:'rgba(59,170,122,0.18)'}}>
              <div className="w-20 h-20 rounded-full flex items-center justify-center border-4 border-mint-DEFAULT"
                style={{background:'rgba(59,170,122,0.2)'}}>
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                  <path d="M20 6L9 17l-5-5" stroke="#3baa7a" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
            </div>
          )}
          {showNo && (
            <div className="absolute inset-0 flex items-center justify-center rounded-3xl fade-in"
              style={{background:'rgba(224,90,90,0.18)'}}>
              <div className="w-20 h-20 rounded-full flex items-center justify-center border-4 border-rose-DEFAULT"
                style={{background:'rgba(224,90,90,0.2)'}}>
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                  <path d="M18 6L6 18M6 6l12 12" stroke="#e05a5a" strokeWidth="3" strokeLinecap="round"/>
                </svg>
              </div>
            </div>
          )}
        </div>

        {/* Info */}
        <div className="flex-1 px-5 pt-4 pb-3 flex flex-col gap-3 overflow-hidden">
          <div>
            <h3 className="text-ink font-800 text-xl leading-tight">{card.name}</h3>
            <p className="text-ink-light text-sm mt-0.5">{card.sub}</p>
          </div>
          <p className="text-ink-light text-sm leading-relaxed flex-1 overflow-hidden" style={{display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
            {card.desc}
          </p>
          <div className="flex gap-1.5 flex-wrap">
            {card.tags.map(tag => (
              <span key={tag} className="text-xs font-600 px-2.5 py-1 rounded-full"
                style={{background:'rgba(26,23,20,0.06)',color:'#6b6560'}}>{tag}</span>
            ))}
          </div>

          {/* Votes so far */}
          <div className="flex items-center justify-between pt-1" style={{borderTop:'1px solid rgba(26,23,20,0.06)'}}>
            <AvatarRow votes={card.votes} size={26} />
            <div className="flex items-center gap-3">
              <span className="text-mint-DEFAULT font-700 text-sm">{yes} ✓</span>
              <span className="text-rose-DEFAULT font-700 text-sm">{no} ✕</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ── Main explorer ──────────────────────────────────────────────────────────────
const ExplorerView = () => {
  const [cat, setCat]       = React.useState('all');
  const [myVotes, setMyVotes] = React.useState({});
  const [idx, setIdx]       = React.useState(0);
  const [animDir, setAnimDir] = React.useState(0);
  const [showResults, setShowResults] = React.useState(false);
  const [lastAction, setLastAction]   = React.useState(null);

  const filtered = cat === 'all' ? CARDS : CARDS.filter(c => c.cat === cat);
  const card = filtered[idx];
  const nextCard = filtered[idx+1];
  const done = idx >= filtered.length;

  const vote = (dir) => {
    if(!card) return;
    setAnimDir(dir);
    setLastAction(dir);
    setMyVotes(v => ({...v, [card.id]: dir}));
    setTimeout(() => {
      setIdx(i => i+1);
      setAnimDir(0);
    }, 380);
  };

  const undoLast = () => {
    if(idx === 0) return;
    setIdx(i => i-1);
    setLastAction(null);
  };

  const totalVoted = Object.keys(myVotes).length;
  const pct = filtered.length > 0 ? Math.round(totalVoted / filtered.length * 100) : 0;

  return (
    <div className="flex flex-col h-full font-jakarta relative overflow-hidden"
      style={{background:'linear-gradient(160deg,#f5f1ea 0%,#ede8df 50%,#e8e2d8 100%)'}}>

      {/* Blobs */}
      <div className="absolute inset-0 pointer-events-none overflow-hidden">
        <div className="absolute w-48 h-48 rounded-full opacity-25" style={{background:'#93c5fd',filter:'blur(56px)',top:'-20px',right:'-20px'}}/>
        <div className="absolute w-40 h-40 rounded-full opacity-20" style={{background:'#fde68a',filter:'blur(44px)',bottom:'220px',left:'-10px'}}/>
      </div>

      {/* Header */}
      <div className="px-5 pt-4 pb-3 flex items-start justify-between relative z-10">
        <div>
          <p className="text-ink-xlight text-xs font-500">Prague · {filtered.length} suggestions</p>
          <h1 className="text-ink font-800 text-2xl leading-tight mt-0.5">Explorer</h1>
        </div>
        <button onClick={() => setShowResults(true)}
          className="flex items-center gap-2 px-3 py-2 rounded-2xl font-600 text-sm"
          style={{background:'rgba(26,23,20,0.08)', color:'#1a1714'}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M18 20V10M12 20V4M6 20v-6" stroke="#1a1714" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          Résultats
        </button>
      </div>

      {/* Category filter */}
      <div className="flex gap-2 px-5 pb-3 overflow-x-auto relative z-10" style={{scrollbarWidth:'none'}}>
        {CATEGORIES.map(c => (
          <button key={c.id} onClick={() => { setCat(c.id); setIdx(0); setMyVotes({}); }}
            className="shrink-0 px-3.5 py-2 rounded-2xl text-sm font-600 transition-all"
            style={{
              background: cat===c.id ? '#1a1714' : 'rgba(255,255,255,0.55)',
              color: cat===c.id ? '#faf9f7' : '#6b6560',
              border: cat===c.id ? 'none' : '1px solid rgba(255,255,255,0.75)',
              boxShadow: cat===c.id ? '0 2px 8px rgba(26,23,20,0.2)' : 'none',
            }}>
            {c.label}
          </button>
        ))}
      </div>

      {/* Progress bar */}
      <div className="px-5 pb-3 relative z-10">
        <div className="flex items-center justify-between mb-1.5">
          <p className="text-ink-xlight text-xs font-500">{totalVoted}/{filtered.length} vus</p>
          {totalVoted > 0 && (
            <button onClick={undoLast} className="text-ink-xlight text-xs font-600 flex items-center gap-1">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                <path d="M3 10h14a4 4 0 010 8H7" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M7 6L3 10l4 4" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Annuler
            </button>
          )}
        </div>
        <div className="h-1 rounded-full overflow-hidden" style={{background:'rgba(26,23,20,0.08)'}}>
          <div className="h-full rounded-full transition-all duration-300" style={{width:`${pct}%`,background:'#1a1714'}}/>
        </div>
      </div>

      {/* Card area */}
      <div className="flex-1 px-5 pb-2 relative z-10">
        {done ? (
          /* Done state */
          <div className="h-full flex flex-col items-center justify-center gap-5 pop-in">
            <div className="w-20 h-20 rounded-3xl flex items-center justify-center text-4xl"
              style={{background:'rgba(59,170,122,0.12)'}}>✅</div>
            <div className="text-center">
              <p className="text-ink font-800 text-xl">Tout vu !</p>
              <p className="text-ink-light text-sm mt-1">Tu as voté sur {totalVoted} suggestion{totalVoted>1?'s':''}.</p>
            </div>
            <button onClick={() => setShowResults(true)}
              className="px-6 py-3.5 rounded-2xl font-700 text-sm"
              style={{background:'#1a1714',color:'white',boxShadow:'0 4px 16px rgba(26,23,20,0.22)'}}>
              Voir les résultats du groupe →
            </button>
            <button onClick={() => { setIdx(0); setMyVotes({}); }}
              className="text-ink-xlight text-sm font-500">
              Recommencer
            </button>
          </div>
        ) : (
          /* Stack */
          <div className="h-full relative">
            {/* Next card shadow underneath */}
            {nextCard && (
              <div className="absolute inset-x-3 top-2 bottom-0 rounded-3xl"
                style={{background:'rgba(255,255,255,0.4)',border:'1px solid rgba(255,255,255,0.6)',zIndex:5}}/>
            )}
            {card && (
              <SwipeCard
                key={`${cat}-${card.id}`}
                card={card}
                onVote={vote}
                myVote={myVotes[card.id]}
                animDir={animDir}
              />
            )}
          </div>
        )}
      </div>

      {/* Vote buttons */}
      {!done && card && (
        <div className="px-5 pb-28 pt-3 flex items-center justify-center gap-6 relative z-10">
          <button onClick={() => vote(-1)}
            className="w-16 h-16 rounded-full flex items-center justify-center transition-transform active:scale-90"
            style={{...glass, boxShadow:'0 4px 20px rgba(224,90,90,0.18)'}}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M18 6L6 18M6 6l12 12" stroke="#e05a5a" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
          </button>

          <button onClick={() => vote(0)}
            className="w-11 h-11 rounded-full flex items-center justify-center transition-transform active:scale-90"
            style={{...glass}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="1.5" fill="#b0aaa3"/>
              <circle cx="6" cy="12" r="1.5" fill="#b0aaa3"/>
              <circle cx="18" cy="12" r="1.5" fill="#b0aaa3"/>
            </svg>
          </button>

          <button onClick={() => vote(1)}
            className="w-16 h-16 rounded-full flex items-center justify-center transition-transform active:scale-90"
            style={{...glass, boxShadow:'0 4px 20px rgba(59,170,122,0.22)'}}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="#3baa7a" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      )}

      <BottomNav />
      {showResults && <ResultsSheet onClose={() => setShowResults(false)} />}
    </div>
  );
};

const App = () => (
  <IOSDevice statusBarStyle="dark" backgroundColor="#ede8e0">
    <ExplorerView />
  </IOSDevice>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
