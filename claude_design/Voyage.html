// ── Copy chip ──────────────────────────────────────────────────────────────────
const CopyChip = ({ label, value, last }) => {
  const [copied, setCopied] = React.useState(false);
  const border = last ? {} : {borderBottom:'1px solid rgba(26,23,20,0.05)'};
  if (!value) return (
    <div className="flex items-center py-2.5" style={border}>
      <div><p className="text-ink-xlight text-xs font-500">{label}</p>
        <p className="text-ink-xlight font-500 text-sm mt-0.5 italic">À confirmer</p></div>
    </div>
  );
  return (
    <button onClick={()=>{setCopied(true);setTimeout(()=>setCopied(false),1800);}}
      className="flex items-center justify-between w-full py-2.5 text-left" style={border}>
      <div className="flex-1 min-w-0 pr-3">
        <p className="text-ink-xlight text-xs font-500">{label}</p>
        <p className="text-ink font-600 text-sm mt-0.5 truncate">{value}</p>
      </div>
      <span className="text-xs font-600 px-2.5 py-1 rounded-full shrink-0 transition-all"
        style={{background:copied?'rgba(59,170,122,0.15)':'rgba(26,23,20,0.07)',color:copied?'#3baa7a':'#6b6560'}}>
        {copied?'✓':'Copier'}
      </span>
    </button>
  );
};

// ── Route progress strip ───────────────────────────────────────────────────────
const RouteStrip = ({ cities }) => {
  const done = cities.filter(c=>c.status==='done').length;
  const activeIdx = cities.findIndex(c=>c.status==='active');
  const progress = (done + (activeIdx >= 0 ? 0.5 : 0)) / cities.length;

  return (
    <div className="rounded-3xl px-5 py-4" style={glass}>
      <div className="flex items-center justify-between mb-3">
        <p className="text-ink font-700 text-sm">22 jours · 7 étapes</p>
        <p className="text-ink-xlight text-xs font-500">Jour 12/22</p>
      </div>
      <div className="relative flex items-center justify-between">
        <div className="absolute left-3 right-3 top-1/2 -translate-y-1/2 h-0.5" style={{background:'rgba(26,23,20,0.09)'}}/>
        <div className="absolute left-3 top-1/2 -translate-y-1/2 h-0.5 transition-all duration-700"
          style={{width:`calc(${progress*100}% - 24px)`, background:'#1a1714'}}/>
        {cities.map((c) => (
          <div key={c.city} className="flex flex-col items-center gap-1.5 relative z-10">
            <div className="w-7 h-7 rounded-full flex items-center justify-center border-2 transition-all text-sm"
              style={{
                background: c.status==='done' ? '#1a1714' : c.status==='active' ? c.color : 'rgba(255,255,255,0.9)',
                borderColor: c.status==='done' ? '#1a1714' : c.status==='active' ? c.color : 'rgba(26,23,20,0.12)',
              }}>
              {c.status==='done'
                ? <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l2.5 2.5 5.5-6" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                : <span style={{fontSize:9}}>{c.flag}</span>
              }
            </div>
            <p style={{fontSize:8,fontWeight:600,color:c.status==='active'?c.color:c.status==='done'?'#b0aaa3':'#6b6560'}}>{c.city.slice(0,4)}</p>
          </div>
        ))}
      </div>
    </div>
  );
};

              <p className="text-ink-light text-xs font-600 mt-1.5">{t.toShort}</p>

              { icon:'🗓️', label:'Date', val:t.date },

                <div className="absolute left-1.5 top-2 bottom-2 w-0.5" style={{background:'rgba(26,23,20,0.10)'}}/>
                <div className="flex flex-col gap-3">

                    <div className="absolute -left-5 w-3 h-3 rounded-full border-2 border-sky-DEFAULT bg-white"/>

                    <p className="text-ink-xlight text-xs ml-auto">{t.dep}</p>

        const isPast = t.status === 'done';
        const isNext = t.status === 'next';

        // ── NEXT: big highlighted card
        if (isNext) return (
          <button key={i} onClick={()=>setOpenTrain(i)}
            className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl p-5" style={{
              background:`linear-gradient(135deg,${t.operatorColor}18 0%,rgba(255,255,255,0.78) 100%)`,
              backdropFilter:'blur(20px) saturate(1.6)', WebkitBackdropFilter:'blur(20px) saturate(1.6)',
              border:`1.5px solid ${t.operatorColor}40`,
              boxShadow:`0 6px 28px ${t.operatorColor}22`,
            }}>
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full" style={{background:t.operatorColor}}/>
                  <p className="text-ink font-700 text-xs">Prochain train · {t.date}</p>
                </div>
                <span className="text-[10px] font-700 px-2.5 py-1 rounded-full" style={{background:`${t.operatorColor}20`,color:t.operatorColor}}>{t.operator} · {t.trainNum}</span>
              </div>
              <div className="flex items-center gap-3 mb-4">
                <div>
                  <p className="text-ink font-800 text-3xl leading-none">{t.dep}</p>
                  <p className="text-ink-light text-xs font-600 mt-1.5">{t.fromShort}</p>
                  <p className="text-ink-light text-[10px] mt-0.5">{t.from.split(' ')[0]}</p>
                </div>
                <div className="flex-1 flex flex-col items-center gap-1.5 mx-2">
                  <p className="text-ink-xlight text-xs">{t.duration}</p>
                  <div className="w-full flex items-center gap-1">
                    <div className="w-1.5 h-1.5 rounded-full" style={{background:t.operatorColor}}/>
                    <div className="flex-1 h-0.5 rounded-full" style={{background:`${t.operatorColor}25`}}/>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke={t.operatorColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <p className="text-ink-xlight text-[10px]">Voie {t.platform}</p>
                </div>
                <div className="text-right">
                  <p className="text-ink font-800 text-3xl leading-none">{t.arr}</p>
                  <p className="text-ink-light text-xs font-600 mt-1.5">{t.toShort}</p>
                  <p className="text-ink-light text-[10px] mt-0.5">{t.to.split(' ')[0]}</p>
                </div>
              </div>
              <div className="rounded-2xl px-3 py-2 flex items-center justify-between"
                style={{background:'rgba(26,23,20,0.05)'}}>
                <div className="flex gap-1">{t.stops.slice(0,2).map((s,j)=><span key={j} className="text-[10px] text-ink-xlight">{s.split(' ')[0]}{j<t.stops.length-1?' · ':''}</span>)}</div>
                <span className="text-[10px] font-600 text-ink-xlight">Billets à venir</span>
              </div>
            </div>
          </button>
        );

        // ── PAST: muted greyscale
        if (isPast) return (
          <button key={i} onClick={()=>setOpenTrain(i)}
            className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl px-4 py-3 flex items-center gap-3" style={{
              background:'rgba(255,255,255,0.28)', border:'1px solid rgba(26,23,20,0.07)', boxShadow:'none',
            }}>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between mb-1">
                  <p className="text-ink-xlight text-xs">{t.date} · {t.trainNum} · <span style={{color:t.operatorColor}}>{t.operator}</span></p>
                  <span className="text-[10px] font-600 px-2 py-0.5 rounded-full" style={{background:'rgba(26,23,20,0.05)',color:'#b0aaa3'}}>Effectué</span>
                </div>
                <div className="flex items-center gap-2">
                  <p className="text-ink-xlight font-700 text-lg leading-none line-through decoration-ink-xlight">{t.dep}</p>
                  <span className="text-ink-xlight text-xs">{t.fromShort}</span>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#d4ccc0" strokeWidth="2" strokeLinecap="round"/></svg>
                  <p className="text-ink-xlight font-700 text-lg leading-none line-through decoration-ink-xlight">{t.arr}</p>
                  <span className="text-ink-xlight text-xs">{t.toShort}</span>
                  <span className="ml-auto text-[10px] font-700 px-2 py-0.5 rounded-full shrink-0" style={{background:'rgba(59,170,122,0.10)',color:'#3baa7a'}}>🎫 {t.tickets.length}</span>
                </div>
              </div>
            </div>
          </button>
        );

        // ── UPCOMING: normal card
        return (
          <button key={i} onClick={()=>setOpenTrain(i)}
            className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl p-4" style={glass}>
              <div className="flex items-center justify-between mb-3">
                <p className="text-ink-xlight text-xs font-500">{t.date} · {t.trainNum}</p>
                <span className="text-[10px] font-700 px-2.5 py-1 rounded-full" style={{background:`${t.operatorColor}15`,color:t.operatorColor}}>{t.operator}</span>
              </div>
              <div className="flex items-center gap-3">
                <div className="min-w-0">
                  <p className="text-ink font-800 text-xl leading-none">{t.dep}</p>
                  <p className="text-ink-light text-xs font-500 mt-1">{t.fromShort} · {t.from.split(' ')[0]}</p>
                </div>
                <div className="flex-1 flex flex-col items-center gap-1 mx-1">
                  <p className="text-ink-xlight text-[10px]">{t.duration}</p>
                  <div className="w-full flex items-center gap-1">
                    <div className="w-1 h-1 rounded-full" style={{background:t.operatorColor}}/>
                    <div className="flex-1 h-px" style={{background:'rgba(26,23,20,0.10)'}}/>
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#b0aaa3" strokeWidth="2.5" strokeLinecap="round"/></svg>
                  </div>
                  <p className="text-ink-xlight text-[10px]">Voie {t.platform}</p>
                </div>
                <div className="text-right min-w-0">
                  <p className="text-ink font-800 text-xl leading-none">{t.arr}</p>
                  <p className="text-ink-light text-xs font-500 mt-1">{t.toShort} · {t.to.split(' ')[0]}</p>
                </div>
              </div>
              <div className="mt-3 flex items-center justify-between">
                <div className="flex gap-1">{t.stops.slice(0,2).map((s,j)=><span key={j} className="text-[10px] px-2 py-0.5 rounded-full" style={{background:'rgba(26,23,20,0.05)',color:'#b0aaa3'}}>{s.split(' ')[0]}</span>)}</div>
                <span className="text-[10px] font-500 px-2.5 py-1 rounded-full" style={{background:'rgba(26,23,20,0.05)',color:'#b0aaa3'}}>Billets à venir</span>
              </div>
            </div>
          </button>
        );
      })}
      })}

      {/* Detail sheet */}
      {openTrain !== null && (
        <TrainDetail t={TRAINS[openTrain]} onClose={()=>setOpenTrain(null)} />
      )}
    </div>
  );
};

// ── HÉBERGEMENT TAB ────────────────────────────────────────────────────────────
const HotelSheet = ({ c, onClose }) => (
  <div className="absolute inset-0 z-40 flex flex-col slide-up"
    style={{background:'linear-gradient(160deg,#f5f1ea 0%,#ede8df 50%,#e8e2d8 100%)'}}>
    <div className="absolute inset-0 pointer-events-none overflow-hidden">
      <div className="absolute w-48 h-48 rounded-full opacity-25"
        style={{background:c.color,filter:'blur(60px)',top:'-20px',right:'-10px'}}/>
    </div>
    <div className="px-5 pt-4 pb-3 flex items-start justify-between relative z-10">
      <div>
        <p className="text-4xl mb-2">{c.flag}</p>
        <h2 className="text-ink font-800 text-2xl">{c.city}</h2>
        <p className="text-ink-light text-sm mt-0.5">{c.days} · {c.nights} nuits</p>
      </div>
      <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center mt-1"
        style={{background:'rgba(26,23,20,0.08)'}}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="#1a1714" strokeWidth="2" strokeLinecap="round"/>
        </svg>
      </button>
    </div>
    <div className="flex-1 overflow-y-auto px-4 pb-24 relative z-10">
      <div className="rounded-3xl p-5" style={glass}>
        <div className="flex items-center gap-2 mb-4">
          <div className="w-8 h-8 rounded-xl flex items-center justify-center text-sm"
            style={{background:'rgba(232,160,48,0.12)'}}>🏠</div>
          <p className="text-ink font-700 text-sm">Hébergement</p>
          {c.status === 'active' && (
            <span className="text-xs font-700 px-2 py-0.5 rounded-full ml-auto"
              style={{background:'rgba(59,170,122,0.12)',color:'#3baa7a'}}>Actuel</span>
          )}
        </div>
        <CopyChip label="Adresse" value={c.airbnb.address} />
        <CopyChip label="Code boîte à clés" value={c.airbnb.code} />
        <CopyChip label="Wi-Fi" value={c.airbnb.wifi && c.airbnb.wifiPass ? `${c.airbnb.wifi} · ${c.airbnb.wifiPass}` : c.airbnb.wifi} last />
        <div className="flex gap-3 mt-4">
          <div className="flex-1 rounded-2xl px-3 py-3 text-center" style={{background:'rgba(232,160,48,0.08)'}}>
            <p className="text-ink-xlight text-xs">Check-in</p>
            <p className="text-ink font-800 text-lg">{c.airbnb.checkin}</p>
          </div>
          <div className="flex-1 rounded-2xl px-3 py-3 text-center" style={{background:'rgba(232,160,48,0.08)'}}>
            <p className="text-ink-xlight text-xs">Check-out</p>
            <p className="text-ink font-800 text-lg">{c.airbnb.checkout}</p>
          </div>
        </div>
        {c.airbnb.notes && (
          <div className="mt-3 rounded-2xl px-4 py-3" style={{background:'rgba(26,23,20,0.04)'}}>
            <p className="text-ink-xlight text-[10px] font-600 uppercase tracking-wider mb-1.5">Notes du propriétaire</p>
            <p className="text-ink-light text-xs leading-relaxed" style={{whiteSpace:'pre-wrap'}}>{c.airbnb.notes}</p>
          </div>
        )}
      </div>
    </div>
  </div>
);

const HebergementTab = () => {
  const [openCity, setOpenCity] = React.useState(null);
  const selected = openCity !== null ? CITIES[openCity] : null;

  return (
    <div className="flex flex-col gap-2.5 relative">
      {CITIES.map((c, i) => {
        const isActive = c.status === 'active';
        const isNext   = c.status === 'next';
        const isPast   = c.status === 'done';

        // ACTIVE: big tinted card
        if (isActive) return (
          <button key={c.city} onClick={()=>setOpenCity(i)} className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl p-5" style={{
              background:`linear-gradient(135deg,${c.color}20 0%,rgba(255,255,255,0.8) 100%)`,
              backdropFilter:'blur(20px) saturate(1.6)', WebkitBackdropFilter:'blur(20px) saturate(1.6)',
              border:`1.5px solid ${c.color}35`, boxShadow:`0 6px 28px ${c.color}20`,
            }}>
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full" style={{background:c.color}}/><p className="text-ink font-700 text-xs">Hébergement actuel · {c.days}</p></div>
                <span className="text-[10px] font-700 px-2.5 py-1 rounded-full" style={{background:`${c.color}20`,color:c.color}}>{c.nights} nuits</span>
              </div>
              <div className="flex items-center gap-4">
                <div className="text-4xl">{c.flag}</div>
                <div className="flex-1 min-w-0">
                  <p className="text-ink font-800 text-2xl">{c.city}</p>
                  <p className="text-ink-light text-xs mt-0.5 truncate">{c.airbnb.address}</p>
                  {c.airbnb.code && <p className="text-ink-light text-xs mt-0.5">Code : <span className="font-700 text-ink">{c.airbnb.code}</span></p>}
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" className="shrink-0"><path d="M9 18l6-6-6-6" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round"/></svg>
              </div>
            </div>
          </button>
        );

        // NEXT: highlighted border
        if (isNext) return (
          <button key={c.city} onClick={()=>setOpenCity(i)} className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl p-4 flex items-center gap-4" style={{...glass, border:`1.5px solid ${c.color}35`}}>
              <div className="relative shrink-0">
                <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl" style={{background:`${c.color}14`}}>{c.flag}</div>
                <div className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full border-2 border-white" style={{background:c.color}}/>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <p className="text-ink font-700 text-base">{c.city}</p>
                  <span className="text-[10px] font-700 px-2 py-0.5 rounded-full" style={{background:`${c.color}18`,color:c.color}}>Prochain</span>
                </div>
                <p className="text-ink-light text-xs mt-0.5">{c.days} · {c.nights} nuits</p>
                <p className="text-ink-xlight text-xs mt-0.5 truncate">{c.airbnb.address}</p>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" className="shrink-0"><path d="M9 18l6-6-6-6" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round"/></svg>
            </div>
          </button>
        );

        // PAST: muted compact
        if (isPast) return (
          <button key={c.city} onClick={()=>setOpenCity(i)} className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl px-4 py-3 flex items-center gap-3" style={{background:'rgba(255,255,255,0.28)',border:'1px solid rgba(26,23,20,0.07)',boxShadow:'none'}}>
              <div className="w-9 h-9 rounded-xl flex items-center justify-center text-xl shrink-0" style={{filter:'grayscale(0.8)',background:'rgba(26,23,20,0.04)'}}>{c.flag}</div>
              <div className="flex-1 min-w-0">
                <p className="text-ink-xlight font-600 text-sm line-through">{c.city}</p>
                <p className="text-ink-xlight text-xs">{c.days}</p>
              </div>
              <div className="w-5 h-5 rounded-full bg-ink flex items-center justify-center shrink-0">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 5.5l2.5 2.5L8.5 2" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
            </div>
          </button>
        );

        // UPCOMING
        return (
          <button key={c.city} onClick={()=>setOpenCity(i)} className="w-full text-left active:scale-[0.98] transition-transform">
            <div className="rounded-3xl p-4 flex items-center gap-4" style={glass}>
              <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shrink-0" style={{background:`${c.color}14`}}>{c.flag}</div>
              <div className="flex-1 min-w-0">
                <p className="text-ink font-700 text-base">{c.city}</p>
                <p className="text-ink-light text-xs mt-0.5">{c.days} · {c.nights} nuits</p>
                <p className="text-ink-xlight text-xs mt-0.5 truncate">{c.airbnb.address}</p>
              </div>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" className="shrink-0"><path d="M9 18l6-6-6-6" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round"/></svg>
            </div>
          </button>
        );
      })}

      {selected && <HotelSheet c={selected} onClose={()=>setOpenCity(null)} />}
    </div>
  );
};

// ── App ────────────────────────────────────────────────────────────────────────
const App = () => {
  const [tab, setTab] = React.useState('trains');

  return (
    <IOSDevice statusBarStyle="dark" backgroundColor="#ede8e0">
      <div className="flex flex-col h-full font-jakarta relative overflow-hidden"
        style={{background:'linear-gradient(160deg,#f5f1ea 0%,#ede8df 50%,#e8e2d8 100%)'}}>

        {/* Blobs */}
        <div className="absolute inset-0 pointer-events-none overflow-hidden">
          <div className="absolute w-48 h-48 rounded-full opacity-25" style={{background:'#93c5fd',filter:'blur(56px)',top:'-20px',right:'-20px'}}/>
          <div className="absolute w-40 h-40 rounded-full opacity-20" style={{background:'#86efac',filter:'blur(44px)',bottom:'220px',left:'-10px'}}/>
        </div>

        {/* Header */}
        <div className="px-5 pt-4 pb-3 relative z-10">
          <div className="flex items-start justify-between mb-4">
            <div>
              <p className="text-ink-xlight text-xs font-500">22 jours · 7 villes · 5 membres</p>
              <h1 className="text-ink font-800 text-2xl leading-tight mt-0.5">Mon Voyage</h1>
            </div>
            <div className="flex -space-x-2 mt-1">
              {['#6b6560','#4a90d9','#3baa7a','#e8a030','#a78bfa'].map((col,i)=>(
                <div key={i} className="w-7 h-7 rounded-full border-2 border-sand-50 flex items-center justify-center text-white font-700"
                  style={{background:col,fontSize:8,zIndex:5-i}}>
                  {['LK','ML','SA','TR','CN'][i]}
                </div>
              ))}
            </div>
          </div>

          {/* Tabs — liquid glass pill */}
          <div className="flex gap-1 p-1 rounded-2xl" style={{
            background:'rgba(26,23,20,0.07)',
            border:'1px solid rgba(255,255,255,0.5)',
          }}>
            {[
              { id:'trains',       label:'🚄 Trains'        },
              { id:'hebergement',  label:'🏠 Hébergement'   },
            ].map(({ id, label }) => (
              <button key={id} onClick={()=>setTab(id)}
                className="flex-1 py-2.5 rounded-xl text-sm font-700 transition-all"
                style={{
                  background: tab===id ? 'rgba(255,255,255,0.75)' : 'transparent',
                  color: tab===id ? '#1a1714' : '#b0aaa3',
                  boxShadow: tab===id ? '0 1px 6px rgba(26,23,20,0.08)' : 'none',
                }}>
                {label}
              </button>
            ))}
          </div>
        </div>

        {/* Content */}
        <div key={tab} className="flex-1 overflow-y-auto px-4 pb-32 space-y-3 relative z-10 fade-in">
          <RouteStrip cities={CITIES} />
          {tab === 'trains'      && <TrainsTab />}
          {tab === 'hebergement' && <HebergementTab />}
          <div className="h-2"></div>
        </div>

        <BottomNav />
      </div>
    </IOSDevice>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
