// ── Collapsible section ────────────────────────────────────────────────────────
const Section = ({ title, icon, badge, children, defaultOpen = false, accent }) => {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <div className="rounded-3xl overflow-hidden" style={glass}>
      <button onClick={() => setOpen(o => !o)}
        className="w-full flex items-center gap-3 p-5 text-left">
        <div className="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 text-lg"
          style={{background: accent ? `${accent}18` : 'rgba(26,23,20,0.06)'}}>
          {icon}
        </div>
        <div className="flex-1 min-w-0">
          <p className="text-ink font-700 text-sm">{title}</p>
          {badge && <p className="text-ink-xlight text-xs mt-0.5">{badge}</p>}
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          style={{transform:open?'rotate(180deg)':'rotate(0deg)', transition:'transform 0.25s'}}>
          <path d="M6 9l6 6 6-6" stroke="#b0aaa3" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
      {open && <div className="px-5 pb-5 fade-in">{children}</div>}
    </div>
  );
};

// ── Copy chip ──────────────────────────────────────────────────────────────────
const CopyChip = ({ label, value }) => {
  const [copied, setCopied] = React.useState(false);
  const copy = () => { setCopied(true); setTimeout(()=>setCopied(false), 1800); };
  return (
    <button onClick={copy} className="flex items-center justify-between w-full py-3 text-left"
      style={{borderBottom:'1px solid rgba(26,23,20,0.05)'}}>
      <div>
        <p className="text-ink-xlight text-xs font-500">{label}</p>
        <p className="text-ink font-600 text-sm mt-0.5">{value}</p>
      </div>
      <span className="text-xs font-600 px-2.5 py-1 rounded-full shrink-0 ml-3 transition-all"
        style={{background: copied ? 'rgba(59,170,122,0.15)' : 'rgba(26,23,20,0.07)', color: copied ? '#3baa7a' : '#6b6560'}}>
        {copied ? '✓ Copié' : 'Copier'}
      </span>
    </button>
  );
};

// ── SOS Modal ─────────────────────────────────────────────────────────────────
const SOSModal = ({ onClose }) => {
  const [selected, setSelected] = React.useState(0);
  const m = MEMBERS[selected];
  const [reveal, setReveal] = React.useState({});
  const toggleReveal = key => setReveal(r => ({...r, [key]: !r[key]}));

  return (
    <div className="absolute inset-0 z-[100] flex flex-col sos-in"
      style={{background:'rgba(20,10,10,0.92)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)'}}>

      {/* Header */}
      <div className="px-5 pt-5 pb-3 flex items-start justify-between">
        <div>
          <div className="flex items-center gap-2 mb-1">
            <div className="w-2 h-2 rounded-full bg-rose-DEFAULT animate-pulse"></div>
            <p className="text-rose-DEFAULT text-xs font-700 tracking-widest uppercase">Urgence groupe</p>
          </div>
          <h2 className="text-white font-800 text-2xl leading-tight">Fiches d'urgence</h2>
          <p className="text-white/50 text-xs mt-1">Données en cache · Disponibles hors ligne</p>
        </div>
        <button onClick={onClose}
          className="w-9 h-9 rounded-full flex items-center justify-center mt-1"
          style={{background:'rgba(255,255,255,0.12)'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="white" strokeWidth="2" strokeLinecap="round"/>
          </svg>
        </button>
      </div>

      {/* Member selector */}
      <div className="flex gap-2 px-5 pb-4 overflow-x-auto" style={{scrollbarWidth:'none'}}>
        {MEMBERS.map((mem, i) => (
          <button key={mem.initials} onClick={() => { setSelected(i); setReveal({}); }}
            className="flex flex-col items-center gap-1.5 shrink-0 transition-all"
            style={{opacity: selected===i ? 1 : 0.45}}>
            <div className="w-12 h-12 rounded-full flex items-center justify-center font-700 text-sm text-white border-2 transition-all"
              style={{background:`${mem.color}cc`, borderColor: selected===i ? 'white' : 'transparent'}}>
              {mem.initials}
            </div>
            <span className="text-white text-[10px] font-600">{mem.name.split(' ')[0]}</span>
          </button>
        ))}
      </div>

      {/* Fiche */}
      <div className="flex-1 overflow-y-auto px-5 pb-6">
        <div key={selected} className="rounded-3xl p-5 slide-up" style={{
          background:'rgba(255,255,255,0.08)',
          border:'1px solid rgba(255,255,255,0.14)',
        }}>
          {/* Identity header */}
          <div className="flex items-center gap-3 mb-5">
            <div className="w-14 h-14 rounded-full flex items-center justify-center font-800 text-lg text-white shrink-0"
              style={{background:`${m.color}bb`}}>
              {m.initials}
            </div>
            <div>
              <p className="text-white font-700 text-lg leading-tight">{m.name}</p>
              <p className="text-white/50 text-xs mt-0.5">{m.role}</p>
            </div>
          </div>

          {/* Rows */}
          {[
            { icon:'📞', label:'Contact d\'urgence', val:`${m.urgence_nom} · ${m.urgence_tel}`, sensitive:false },
            { icon:'🚫', label:'Allergies', val:m.allergies, sensitive:false, alert:false },
            { icon:'🏥', label:'N° CEAM', val:m.ceam, sensitive:true },
            { icon:'🪪', label:'Passeport / CNI', val:m.passeport, sensitive:true },
          ].map(({ icon, label, val, sensitive, alert }) => (
            <div key={label} className="py-3.5" style={{borderBottom:'1px solid rgba(255,255,255,0.08)'}}>
              <p className="text-white/45 text-xs font-500 mb-1">{icon} {label}</p>
              <div className="flex items-center justify-between gap-3">
                <p className={`font-600 text-sm flex-1 ${alert ? 'text-rose-DEFAULT' : 'text-white'}`}>
                  {sensitive && !reveal[label]
                    ? '•'.repeat(Math.min(val.length, 12))
                    : val}
                </p>
                {sensitive && (
                  <button onClick={() => toggleReveal(label)}
                    className="shrink-0 px-2.5 py-1 rounded-full text-xs font-600"
                    style={{background:'rgba(255,255,255,0.1)', color:'rgba(255,255,255,0.6)'}}>
                    {reveal[label] ? 'Masquer' : 'Afficher'}
                  </button>
                )}
              </div>
            </div>
          ))}
        </div>

        {/* Emergency numbers quick strip */}
        <div className="mt-3 rounded-3xl p-4" style={{background:'rgba(224,90,90,0.15)', border:'1px solid rgba(224,90,90,0.25)'}}>
          <p className="text-white font-700 text-xs mb-3 uppercase tracking-wider">Numéros d'urgence · Pays actuel</p>
          <div className="grid grid-cols-3 gap-2">
            {[['🚨','Urgences','112'],['🚓','Police','158'],['🚑','SAMU','155']].map(([ic,lb,num])=>(
              <div key={lb} className="flex flex-col items-center gap-1 py-2 rounded-2xl"
                style={{background:'rgba(255,255,255,0.07)'}}>
                <span className="text-xl">{ic}</span>
                <p className="text-white/50 text-[10px]">{lb}</p>
                <p className="text-white font-800 text-lg leading-none">{num}</p>
              </div>
            ))}
          </div>
          <div className="mt-3 pt-3" style={{borderTop:'1px solid rgba(255,255,255,0.08)'}}>
            <p className="text-white/40 text-[10px] font-500 mb-1">Ambassade française · Prague</p>
            <p className="text-white font-600 text-sm">+420 251 171 711</p>
          </div>
        </div>
      </div>
    </div>
  );
};

              <path d="M9 18l6-6-6-6" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>

        {/* Scrollable content */}
        <div className="flex-1 overflow-y-auto px-4 pb-32 space-y-3 relative z-10">

          {/* Billets de train */}
          <Section title="Billets de train" icon="🚄" badge="6 trajets · 3 PDF disponibles" accent="#4a90d9">
            <div className="flex flex-col gap-2">
              {TRAINS.map((t, i) => (
                <div key={i} className="flex items-center gap-3 py-2.5"
                  style={{borderBottom: i < TRAINS.length-1 ? '1px solid rgba(26,23,20,0.05)' : 'none'}}>
                  <div className="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 text-sm font-700 text-sky-DEFAULT"
                    style={{background:'rgba(74,144,217,0.1)'}}>
                    {i+1}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-ink font-600 text-xs truncate">{t.from} → {t.to}</p>
                    <p className="text-ink-xlight text-xs mt-0.5">{t.date} · {t.dep}–{t.arr}</p>
                  </div>
                  {t.pdf
                    ? <span className="text-xs font-600 px-2 py-1 rounded-full shrink-0" style={{background:'rgba(59,170,122,0.12)',color:'#3baa7a'}}>PDF ✓</span>
                    : <span className="text-xs font-500 px-2 py-1 rounded-full shrink-0" style={{background:'rgba(26,23,20,0.07)',color:'#b0aaa3'}}>À venir</span>
                  }
                </div>
              ))}
            </div>
          </Section>

          {/* Plans de gare */}
          <Section title="Plans de gare" icon="🗺️" badge="Correspondances critiques · Tuiles cachées" accent="#3baa7a">
            <div className="flex flex-col gap-3">
              {[
                { name:'Praha hlavní nádraží', note:'Correspondance 22 min · Quai 4→7' },
                { name:'Renens (Lausanne)', note:'Correspondance 5 min · Quai A→D' },
              ].map(({ name, note }) => (
                <div key={name}>
                  <StationMap name={name} />
                  <p className="text-ink-xlight text-xs mt-1.5 ml-1">{note}</p>
                </div>
              ))}
            </div>
          </Section>

          {/* Urgences par pays */}
          <Section title="Numéros d'urgence" icon="🆘" badge="7 pays · Ambassades incluses" accent="#e05a5a">
            <div className="flex flex-col gap-1">
              {URGENCES.map((u, i) => (
                <div key={i} className="py-3" style={{borderBottom: i < URGENCES.length-1 ? '1px solid rgba(26,23,20,0.05)' : 'none'}}>
                  <p className="text-ink font-600 text-sm mb-2">{u.pays}</p>
                  <div className="flex gap-2 flex-wrap">
                    {[['🚨',u.urgence,'Urgences'],['🚓',u.police,'Police'],['🚑',u.samu,'SAMU']].map(([ic,num,lbl])=>(
                      <div key={lbl} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl"
                        style={{background:'rgba(26,23,20,0.05)'}}>
                        <span className="text-xs">{ic}</span>
                        <span className="text-ink-light text-xs">{lbl}</span>
                        <span className="text-ink font-700 text-xs">{num}</span>
                      </div>
                    ))}
                  </div>
                  <p className="text-ink-xlight text-xs mt-2">🇫🇷 Ambassade · {u.embassy}</p>
                </div>
              ))}
            </div>
          </Section>

          <div className="h-2"></div>
        </div>

        <BottomNav />

        {/* SOS overlay */}
        {sosOpen && <SOSModal onClose={() => setSosOpen(false)} />}
      </div>
    </IOSDevice>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
